<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>价格比较 | KOREA SKIN PRICE</title><link rel="stylesheet" href="assets/style.css"></head><body>
<div class="topbar"><div class="container"><span>KOREA SKIN PRICE · PRICE DATABASE</span><span>SEYE CLINIC · CLINIC #001</span></div></div><nav class="nav"><div class="container navin"><a class="logo" href="index.html">KOREA SKIN PRICE<small>SEOUL AESTHETIC PRICE DATABASE</small></a><div class="navlinks"><a href="prices.html">价格比较</a><a href="clinic-seye.html">诊所</a><a href="how.html">如何使用</a></div></div></nav>
<section class="section"><div class="container"><div class="section-head"><div><span class="tag">CLINIC #001 · SEYE</span><h2>价格数据库</h2><p>先从一家诊所开始。未来增加更多诊所后，这里将成为跨诊所比较表。</p></div></div><div class="searchbox" style="border:1px solid var(--line);box-shadow:0 8px 25px rgba(40,30,25,.04)"><input id="q" placeholder="搜索项目：리쥬란、울쎄라、Oligio、보톡스…"><button onclick="render()">搜索</button></div><div class="pricebar" id="filters"></div><div class="tablewrap"><table><thead><tr><th>分类</th><th>项目</th><th>规格 / English</th><th>活动价</th><th>原价</th><th>活动类型</th></tr></thead><tbody id="tbody"></tbody></table></div></div></section><footer class="footer"><div class="container"><strong>KOREA SKIN PRICE</strong>价格来源：세예클리닉官网及价格表资料 · VAT状态按原始记录保留。</div></footer>
<script src="assets/data.js"></script><script>
const cats=['全部',...new Set(prices.map(p=>p.cat))];let active='全部';
const filters=document.getElementById('filters');filters.innerHTML=cats.map((c,i)=>`<button class="filter ${i===0?'active':''}" data-cat="${c}">${c}</button>`).join('');
filters.addEventListener('click',e=>{if(!e.target.classList.contains('filter'))return;active=e.target.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');render()});
const params=new URLSearchParams(location.search);document.getElementById('q').value=params.get('q')||'';
function render(){const q=document.getElementById('q').value.trim().toLowerCase();const list=prices.filter(p=>(active==='全部'||p.cat===active)&&(!q||(p.kr+' '+p.en+' '+p.cat+' '+p.tag).toLowerCase().includes(q)));document.getElementById('tbody').innerHTML=list.map(p=>`<tr><td>${p.cat}</td><td><div class="kr">${p.kr}</div></td><td>${p.en}</td><td><span class="sale">₩${Number(p.sale).toLocaleString()}</span><div class="vat">VAT 별도</div></td><td>₩${Number(p.old).toLocaleString()}</td><td>${p.tag}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有找到匹配项目。试试 Rejuran / Ulthera / Botox。</td></tr>'}render();
</script></body></html>
