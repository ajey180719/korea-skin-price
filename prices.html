<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>价格比较 | KOREA SKIN PRICE</title><link rel="stylesheet" href="assets/style.css"></head><body>
<nav class="nav"><div class="container navin"><a class="logo" href="index.html">KOREA SKIN PRICE<small>SEOUL AESTHETIC PRICE DATABASE</small></a><div class="navlinks"><a href="prices.html">价格比较</a><a href="clinic-seye.html">세예诊所</a><a href="how.html">如何使用</a></div></div></nav>
<section class="section"><div class="container"><span class="tag">CLINIC #001 · SEYE</span><h1 style="font-family:Georgia,serif;font-weight:400;font-size:42px">세예클리닉价格库</h1>
<p class="lead">先把一家诊所的数据标准化。以后新增诊所后，这里将自动变成跨诊所比较。</p>
<div class="searchbox" style="border:1px solid var(--line);box-shadow:none"><input id="q" placeholder="搜索项目，例如：리쥬란、울쎄라、Oligio"><button onclick="render()">搜索</button></div>
<div class="pricebar" id="filters"></div>
<div class="tablewrap"><table><thead><tr><th>分类</th><th>项目</th><th>规格</th><th>活动价</th><th>原价</th><th>活动类型</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div></section><footer class="footer"><div class="container">价格来源：세예클리닉官网；本站整理时间：2026-09-10；VAT状态按原始价格记录。</div></footer>
<script src="assets/data.js"></script><script>
const cats=['全部',...new Set(prices.map(p=>p.cat))];let active='全部';
document.getElementById('filters').innerHTML=cats.map(c=>`<button class="filter ${{c==='全部'?'active':''}}" onclick="active='${{c}}';document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));this.classList.add('active');render()">${{c}}</button>`).join('');
const params=new URLSearchParams(location.search);document.getElementById('q').value=params.get('q')||'';
function render(){{const q=document.getElementById('q').value.toLowerCase();const list=prices.filter(p=>(active==='全部'||p.cat===active)&&(!q||(p.kr+p.en).toLowerCase().includes(q)));document.getElementById('tbody').innerHTML=list.map(p=>`<tr><td>${{p.cat}}</td><td><div class="kr">${{p.kr}}</div></td><td>${{p.en}}</td><td><span class="sale">₩${{p.sale}}</span><div class="vat">VAT 별도</div></td><td>₩${{p.old}}</td><td>${{p.tag}}</td></tr>`).join('')||'<tr><td colspan="6">没有找到匹配项目</td></tr>'}}
render();
</script></body></html>
